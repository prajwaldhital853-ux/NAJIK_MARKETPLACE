# Render Blueprint — sync or copy these settings into your Web Service dashboard.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: najik-api
    runtime: python
    rootDir: backend
    # Build must NOT run migrate — only pip install.
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/render_start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DEBUG
        value: "false"
      # Link Postgres in the dashboard, or set DATABASE_URL manually:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: najik-db
      #     property: connectionString
