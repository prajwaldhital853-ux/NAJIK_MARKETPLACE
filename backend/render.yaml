# Render Blueprint (optional). You can also configure the web service manually in the dashboard.
# Docs: https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: najik-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/render_start.sh
    healthCheckPath: /api/app-control/privacy-retention/
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.8"
      # Set in Render dashboard (secrets / URLs):
      # DJANGO_SECRET_KEY, JWT_SIGNING_KEY, DATABASE_URL, CORS_ALLOWED_ORIGINS,
      # CLOUDINARY_URL, REDIS_URL (optional), GOOGLE_CLIENT_IDS, etc.
      #
      # Load test — 5000 demo sellers + listings on deploy (no shell needed):
      - key: NAJIK_LOAD_TEST_SEED
        value: "5000"
